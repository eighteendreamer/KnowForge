# KnowForge 生产入口片段：把 /v1 与 /health 反代到后端，前端与 API 因此同源。
# 后端没有 CORSMiddleware，跨域直连一律不可用，所以两个前端都必须和 API 同源。
# 故意不代理 /metrics：那是 Prometheus 抓取端点，即使带 Bearer Token 也不该出现在公网。
#
# 由 knowforge.conf.example 里两个 server 块 include；单独贴到面板的反向代理输入框时，
# 记得把 proxy_pass 的目标改成 upstream 名字或 http://127.0.0.1:8000。

location /v1/ {
    proxy_pass http://knowforge_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 含远程精排的完整链路实测单次 1.4 秒量级，按网关默认 60 秒超时掐不断，但慢查询要能跑完。
    proxy_read_timeout 120s;
    # 单文件上限来自 KNOFORGE_UPLOAD_MAX_BYTES（默认 50MiB），网关不要卡在应用前面。
    client_max_body_size 52m;
}

location = /health {
    proxy_pass http://knowforge_api;
    access_log off;
}
