[project]
name = "knowforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "lxml>=6.1.3",
    "nh3>=0.3.7",
    "openai>=3.19.2",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "rapidfuzz>=3.14.6",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "tokenizers>=0.23.2",
    "uvicorn[standard]>=0.53.0",
    "zhconv>=1.4.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "scripts", "sdk/python"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = [
    "default",
    "error:::app\\..*",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
explicit_package_bases = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "jieba.*", "filetype.*", "zhconv.*"]
ignore_missing_imports = true
